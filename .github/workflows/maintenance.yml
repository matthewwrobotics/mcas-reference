name: Weekly maintenance

on:
  schedule:
    # Mondays, 09:00 UTC. A weekly cadence matches how fast citations actually
    # rot; daily would mostly generate noise.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Link check and freshness sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Check the built HTML rather than the source files. Every citation is
      # rendered as an anchor, so one pass over dist covers all external
      # citations *and* every internal link, including ones generated from data.
      #
      # The site is served from a base path, so root-relative hrefs look like
      # /mcas-reference/foods. Staging dist under a matching directory lets
      # lychee resolve those against the filesystem instead of reporting every
      # internal link as broken.
      - name: Stage built site under its base path
        run: |
          mkdir -p _linkcheck
          cp -r dist _linkcheck/mcas-reference

      # Accepted codes are deliberately broad. PubMed answers non-browser agents
      # with 203, and several patient-organization sites answer bots with 403 —
      # both mean "the page is there", and treating them as failures would train
      # everyone to ignore this job's issues.
      - name: Link check
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          args: >-
            --base _linkcheck
            --no-progress
            --max-retries 2
            --max-concurrency 8
            --timeout 30
            --accept 200,203,206,301,302,403,429
            --user-agent "Mozilla/5.0 (compatible; mcas-reference link checker)"
            "_linkcheck/mcas-reference/**/*.html"
          output: ./lychee/out.md

      - name: Freshness sweep
        if: always()
        run: node scripts/check-staleness.mjs --out ./lychee/staleness.md

      - name: Assemble report
        if: always()
        run: |
          {
            echo "Automated weekly check of every cited link and every entry's verification date."
            echo
            cat ./lychee/staleness.md
            echo
            echo "---"
            echo
            cat ./lychee/out.md
          } > ./lychee/report.md

      # Open an issue only when links are actually broken. A freshness-only
      # report goes to the run summary rather than generating a weekly issue
      # nobody reads.
      - name: Open issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found in cited sources
          content-filepath: ./lychee/report.md
          labels: maintenance, automated

      - name: Publish report to run summary
        if: always()
        run: cat ./lychee/report.md >> "$GITHUB_STEP_SUMMARY"
